<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zee Imobiliária - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #F0F0F0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 400px; width: 90%; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); overflow: hidden; }

        .login-card { padding: 40px; text-align: center; }
        .logo-img { width: 100px; height: auto; margin-bottom: 20px; } /* Ajuste o tamanho conforme necessário */
        h1 { font-size: 24px; color: #333; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; transition: border-color 0.3s; }
        .input-group input:focus { border-color: #E62B4E; outline: none; box-shadow: 0 0 5px rgba(230, 43, 78, 0.5); } /* Vermelho principal */
        
        .btn-login { 
            width: 100%; padding: 15px; background: #E62B4E; color: white; border: none; 
            border-radius: 8px; font-size: 18px; cursor: pointer; transition: background 0.3s; 
        }
        .btn-login:hover { background: #CC2545; } /* Vermelho mais escuro */
        
        #mensagem-erro { color: #E62B4E; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <img src="img/logo.png" alt="Zee Imobiliária Logo" class="logo-img">
            <h1>Zee Imobiliária - Gestão de Tempo</h1>
            <form id="form-login">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required>
                </div>
                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" required>
                </div>
                <button type="submit" class="btn-login">ENTRAR</button>
                <p id="mensagem-erro" style="display: none;">E-mail ou senha inválidos.</p>
            </form>
        </div>
    </div>
    <script>
        const API_BASE_URL = window.location.origin; // Assume que a API está no mesmo domínio

        document.getElementById('form-login').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const erro = document.getElementById('mensagem-erro');
            erro.style.display = 'none'; // Esconde a mensagem de erro anterior

            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const data = await response.json();

                if (response.ok && data.authenticated) {
                    // Armazena informações do usuário (ID, nome, permissão) no localStorage
                    localStorage.setItem('usuarioLogadoId', data.id);
                    localStorage.setItem('usuarioLogadoNome', data.nome);
                    localStorage.setItem('usuarioLogadoPermissao', data.permissao);
                    window.location.href = 'menu.html';
                } else {
                    erro.textContent = data.message || 'E-mail ou senha inválidos.';
                    erro.style.display = 'block';
                }
            } catch (error) {
                console.error('Erro de conexão ou login:', error);
                erro.textContent = 'Erro de conexão. Tente novamente.';
                erro.style.display = 'block';
            }
        });
    </script>
</body>
</html>
