<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zee Imobiliária - Registro de Ponto</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Estilos base */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #F0F0F0; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 800px; width: 100%; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); overflow: hidden; margin-bottom: 30px; }
        
        header { background: #E62B4E; color: white; padding: 20px; text-align: center; }
        .header-content { display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        .logo-header { height: 40px; width: auto; margin-right: 15px; }
        h1 { font-size: 28px; margin-bottom: 5px; }
        .description { font-size: 16px; opacity: 0.9; }
        main { padding: 40px 20px; text-align: center; }
        
        /* Estilos do Ponto */
        #nome-funcionario { font-size: 1.2em; margin-bottom: 25px; color: #333; font-weight: bold;}

        #status-ponto { font-size: 24px; font-weight: bold; margin-bottom: 30px; padding: 15px; border-radius: 10px; }
        .status-trabalhando { background-color: #2ecc71; color: white; } /* Verde */
        .status-pausa { background-color: #f1c40f; color: #333; } /* Amarelo */
        .status-fora { background-color: #E62B4E; color: white; } /* Vermelho */

        .btn-ponto-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .btn-ponto { 
            padding: 15px 30px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; 
            transition: transform 0.2s, opacity 0.2s; min-width: 180px;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-ponto:hover { transform: translateY(-3px); }
        .btn-ponto i { margin-right: 10px; }

        .btn-checkin { background: #E62B4E; color: white; } /* Vermelho principal */
        .btn-pausa { background: #F39C12; color: white; } /* Laranja */
        .btn-retorno { background: #27AE60; color: white; } /* Verde escuro */
        .btn-checkout { background: #333; color: white; } /* Cinza escuro */
        
        .hidden { display: none !important; }

        #mensagem-retorno { margin-top: 30px; color: #E62B4E; font-weight: bold; }
        .btn-back { display: block; margin-top: 30px; text-align: center; text-decoration: none; color: #E62B4E; font-weight: bold; }
        .btn-back:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <img src="img/imagens.png" alt="Zee Imobiliária Logo" class="logo-header">
                <h1>Registro de Ponto Eletrônico</h1>
            </div>
            <p class="description">Marque sua jornada de trabalho com agilidade.</p>
        </header>

        <main>
            <p id="nome-funcionario">Funcionário: **Carregando...**</p>
            
            <div id="status-ponto" class="status-fora">
                STATUS: Você está Fora de Expediente
            </div>

            <div class="btn-ponto-group">
                <button id="btn-checkin" class="btn-ponto btn-checkin" onclick="registrarPonto('checkin')">
                    <i class="fas fa-sign-in-alt"></i> Check-in
                </button>
                
                <button id="btn-pausa" class="btn-ponto btn-pausa hidden" onclick="registrarPonto('pausa')">
                    <i class="fas fa-mug-hot"></i> Pausa
                </button>

                <button id="btn-retorno" class="btn-ponto btn-retorno hidden" onclick="registrarPonto('retorno')">
                    <i class="fas fa-play-circle"></i> Retorno Pausa
                </button>
                
                <button id="btn-checkout" class="btn-ponto btn-checkout hidden" onclick="registrarPonto('checkout')">
                    <i class="fas fa-sign-out-alt"></i> Check-out
                </button>
            </div>
            
            <p id="mensagem-retorno"></p>
            <a href="menu.html" class="btn-back"><i class="fas fa-arrow-left"></i> Voltar ao Menu</a>
        </main>
    </div>
    <script>
        const API_BASE_URL = window.location.origin;
        let estadoAtual = 'fora'; // 'fora', 'trabalhando', 'pausa'
        let funcionarioId = null;
        let funcionarioNome = null;

        function checkLogin() {
            funcionarioId = localStorage.getItem('usuarioLogadoId');
            funcionarioNome = localStorage.getItem('usuarioLogadoNome');

            if (!funcionarioId) {
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('nome-funcionario').innerHTML = `Funcionário: **${funcionarioNome}**`;
            // Em uma aplicação real, você buscaria o último status de ponto do funcionário aqui
            // Por enquanto, vamos manter o 'fora' como padrão inicial
            atualizarInterface();
        }

        // Função para atualizar a interface (botões e status)
        function atualizarInterface() {
            const statusDiv = document.getElementById('status-ponto');
            const btns = ['checkin', 'pausa', 'retorno', 'checkout'];
            
            btns.forEach(id => document.getElementById(`btn-${id}`).classList.add('hidden'));

            statusDiv.classList.remove('status-fora', 'status-trabalhando', 'status-pausa');

            if (estadoAtual === 'fora') {
                statusDiv.textContent = 'STATUS: Você está Fora de Expediente';
                statusDiv.classList.add('status-fora');
                document.getElementById('btn-checkin').classList.remove('hidden');
            } else if (estadoAtual === 'trabalhando') {
                statusDiv.textContent = 'STATUS: Trabalhando';
                statusDiv.classList.add('status-trabalhando');
                document.getElementById('btn-pausa').classList.remove('hidden');
                document.getElementById('btn-checkout').classList.remove('hidden');
            } else if (estadoAtual === 'pausa') {
                statusDiv.textContent = 'STATUS: Em Pausa (Lanche, Almoço, etc.)';
                statusDiv.classList.add('status-pausa');
                document.getElementById('btn-retorno').classList.remove('hidden');
            }
        }

        // Função principal para registrar o ponto
        async function registrarPonto(tipo) {
            const mensagemRetornoDiv = document.getElementById('mensagem-retorno');
            mensagemRetornoDiv.textContent = 'Registrando ponto...';
            
            let proximoEstado;
            let mensagemUsuario = '';
            
            if (tipo === 'checkin') {
                proximoEstado = 'trabalhando';
                mensagemUsuario = `✅ Check-in realizado. Bom trabalho!`;
            } else if (tipo === 'pausa') {
                proximoEstado = 'pausa';
                mensagemUsuario = `☕ Pausa registrada. Aproveite!`;
            } else if (tipo === 'retorno') {
                proximoEstado = 'trabalhando';
                mensagemUsuario = `💪 Retorno de Pausa registrado. De volta ao trabalho!`;
            } else if (tipo === 'checkout') {
                proximoEstado = 'fora';
                mensagemUsuario = `🏠 Check-out realizado. Até amanhã!`;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/ponto`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ funcionario: funcionarioId, tipo: tipo })
                });

                const data = await response.json();

                if (response.ok) {
                    estadoAtual = proximoEstado; 
                    mensagemRetornoDiv.textContent = `${mensagemUsuario} (${new Date(data.registro.dataHora).toLocaleTimeString('pt-BR')})`;
                } else {
                    mensagemRetornoDiv.textContent = `❌ Erro: ${data.message || 'Falha ao registrar ponto.'}`;
                }

            } catch (error) {
                console.error('Erro ao registrar ponto:', error);
                mensagemRetornoDiv.textContent = '❌ Erro de conexão com o servidor.';
            } finally {
                atualizarInterface();
            }
        }

        window.onload = checkLogin;
    </script>
</body>

</html>
