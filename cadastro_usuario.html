<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zee HUB - Cadastro de Usuário</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Estilos base (vermelho/branco) */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #F0F0F0; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 800px; width: 100%; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); overflow: hidden; margin-bottom: 30px; }
        
        header { background: #E62B4E; color: white; padding: 20px; text-align: center; }
        .header-content { display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        .logo-header { height: 40px; width: auto; margin-right: 15px; }
        h1 { font-size: 28px; margin-bottom: 5px; }
        .description { font-size: 16px; opacity: 0.9; }
        main { padding: 40px 20px; }

        /* Estilos do Formulário */
        form { background: #fdfdfd; padding: 30px; border-radius: 10px; border: 1px solid #eee; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        .input-group input, .input-group select { 
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; 
            transition: border-color 0.3s; font-size: 16px;
        }
        .input-group input:focus, .input-group select:focus { border-color: #E62B4E; outline: none; box-shadow: 0 0 5px rgba(230, 43, 78, 0.5); }
        
        .btn-submit { 
            width: 100%; padding: 15px; background: #E62B4E; color: white; border: none; 
            border-radius: 8px; font-size: 18px; cursor: pointer; transition: background 0.3s; 
        }
        .btn-submit:hover { background: #CC2545; }

        /* Mensagens de feedback */
        #msg-feedback { 
            margin-top: 20px; padding: 15px; border-radius: 5px; font-weight: bold; 
            text-align: center; display: none;
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; } 
        .loading { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; } 
        
        .btn-back { display: block; margin-top: 20px; text-align: center; text-decoration: none; color: #E62B4E; font-weight: bold; }
        .btn-back:hover { text-decoration: underline; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <img src="img/logo.png" alt="Zee Imobiliária Logo" class="logo-header">
                <h1>Cadastro de Usuário com Acesso</h1>
            </div>
            <p class="description">Crie contas para administradores e gerentes que farão login no sistema.</p>
        </header>

        <main id="main-content">
            
            <form id="form-cadastro-usuario">
                <div id="admin-warning" class="hidden error" style="margin-bottom: 20px; padding: 10px;">
                    <i class="fas fa-exclamation-triangle"></i> ATENÇÃO: Você está cadastrando o **primeiro** Administrador do sistema. Esta ação é irreversível.
                </div>
                
                <div class="input-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" required>
                </div>

                <div class="input-group">
                    <label for="email">E-mail (Login)</label>
                    <input type="email" id="email" required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha Inicial</label>
                    <input type="password" id="senha" required>
                </div>

                <div class="input-group">
                    <label for="cargo">Cargo na Zee</label>
                    <input type="text" id="cargo" required>
                </div>

                <div class="input-group" id="permissao-group">
                    <label for="permissao">Nível de Acesso ao Sistema</label>
                    <select id="permissao" required>
                        <option value="funcionario">Funcionário (Acesso Básico ao Menu)</option>
                        <option value="admin">Admin (Acesso Total)</option>
                    </select>
                </div>
                
                <button type="submit" class="btn-submit">
                    <i class="fas fa-lock"></i> CADASTRAR USUÁRIO ACESSO
                </button>
            </form>
            
            <div id="msg-feedback"></div>
            <a href="login.html" class="btn-back" id="back-to-menu"><i class="fas fa-arrow-left"></i> Ir para Login</a>
        </main>
    </div>
    <script>
        const API_BASE_URL = window.location.origin;
        const form = document.getElementById('form-cadastro-usuario');
        const adminWarning = document.getElementById('admin-warning');
        const permissaoGroup = document.getElementById('permissao-group');
        const backToMenu = document.getElementById('back-to-menu');
        
        backToMenu.href = 'login.html'; // Garante que o link de retorno aponte para o login

        // Nova função para verificar APENAS o status inicial do admin e configurar o formulário
        async function setupForm() {
            try {
                // Tenta chamar a rota de verificação do Back-end.
                const response = await fetch(`${API_BASE_URL}/api/admin/check-initial`);
                
                // Se o fetch falhar em conectar (erro de rede/CORS), a execução pula para o catch.
                if (!response.ok) {
                    throw new Error(`API retornou status: ${response.status}`);
                }
                
                const data = await response.json();
                const hasAdmin = data.hasAdmin;

                if (!hasAdmin) {
                    // CASO: SEM ADMINS NO BANCO -> FORÇA ADMIN e mostra aviso.
                    adminWarning.classList.remove('hidden');
                    permissaoGroup.classList.add('hidden'); // Oculta a seleção
                    document.getElementById('permissao').value = 'admin'; 
                } else {
                    // CASO: JÁ TEM ADMINS -> Modo normal.
                    adminWarning.classList.add('hidden');
                    permissaoGroup.classList.remove('hidden');
                }

            } catch (error) {
                // Se a API falhar (ex: Servidor fora do ar), o catch é executado.
                // Aqui, assumimos o modo de PRIMEIRO ADMIN para que o usuário
                // possa tentar o cadastro, que pode falhar ou não dependendo do erro.
                console.warn('Falha na comunicação inicial com a API. Assumindo modo de cadastro do PRIMEIRO ADMIN (Necessário para desbloqueio inicial).', error);
                adminWarning.classList.remove('hidden');
                permissaoGroup.classList.add('hidden');
                document.getElementById('permissao').value = 'admin';
                
                // Exibe uma mensagem de atenção, mas não bloqueia o formulário.
                const msg = document.getElementById('msg-feedback');
                msg.className = 'error';
                msg.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Atenção: A comunicação inicial falhou. Tente cadastrar o usuário. Se falhar, verifique se a API está online.';
                msg.style.display = 'block';
            }
        }
        
        // Inicia a configuração do formulário imediatamente, sem o 'loading'
        window.onload = setupForm;


        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const msg = document.getElementById('msg-feedback');
            const submitBtn = document.querySelector('.btn-submit');
            
            msg.className = 'loading';
            msg.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Aguarde, cadastrando usuário...';
            msg.style.display = 'block';
            submitBtn.disabled = true;

            const dados = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                senha: document.getElementById('senha').value,
                cargo: document.getElementById('cargo').value,
                permissao: document.getElementById('permissao').value 
            };

            try {
                const response = await fetch(`${API_BASE_URL}/api/cadastro`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                const data = await response.json();

                if (response.ok) {
                    msg.className = 'success';
                    msg.innerHTML = `<i class="fas fa-check-circle"></i> ${data.message} Agora você pode fazer login.`;
                    form.reset(); 
                    
                    // Redireciona para o login após 3s
                    setTimeout(() => { window.location.href = 'login.html'; }, 3000);
                    
                } else {
                    msg.className = 'error';
                    msg.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Erro: ${data.message || 'Falha ao cadastrar usuário.'}`;
                }

            } catch (error) {
                msg.className = 'error';
                msg.innerHTML = '<i class="fas fa-times-circle"></i> Erro de rede. Verifique a conexão com a API e tente novamente.';
            } finally {
                submitBtn.disabled = false;
                // Executa setupForm novamente para redefinir o estado de "primeiro admin" após o cadastro
                setupForm(); 
            }
        });
    </script>
</body>
</html>
