<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zee Imobiliária - Cadastro de Funcionário Ponto</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Estilos base (vermelho/branco) */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #F0F0F0; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); overflow: hidden; margin-bottom: 30px; }
        
        header { background: #E62B4E; color: white; padding: 20px; text-align: center; }
        .header-content { display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        .logo-header { height: 40px; width: auto; margin-right: 15px; }
        h1 { font-size: 24px; margin-bottom: 5px; }
        .description { font-size: 16px; opacity: 0.9; }
        main { padding: 40px 20px; }

        /* Estilos do Formulário */
        form { background: #fdfdfd; padding: 30px; border-radius: 10px; border: 1px solid #eee; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        .input-group input { 
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; 
            transition: border-color 0.3s; font-size: 16px;
        }
        .input-group input:focus { border-color: #E62B4E; outline: none; box-shadow: 0 0 5px rgba(230, 43, 78, 0.5); }
        
        .btn-submit { 
            width: 100%; padding: 15px; background: #E62B4E; color: white; border: none; 
            border-radius: 8px; font-size: 18px; cursor: pointer; transition: background 0.3s; 
        }
        .btn-submit:hover { background: #CC2545; }

        /* Mensagens de feedback */
        #msg-feedback { 
            margin-top: 20px; padding: 15px; border-radius: 5px; font-weight: bold; 
            text-align: center; display: none;
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; } 
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6fb; } 
        .loading { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; } 
        
        .btn-back { display: block; margin-top: 20px; text-align: center; text-decoration: none; color: #E62B4E; font-weight: bold; }
        .btn-back:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <img src="img/logo.png" alt="Zee Imobiliária Logo" class="logo-header">
                <h1>Cadastro de Funcionário (Apenas Ponto)</h1>
            </div>
            <p class="description">Adicione novos colaboradores que apenas registrarão o ponto (sem acesso ao sistema).</p>
        </header>

        <main>
            <form id="form-cadastro-ponto">
                
                <div class="input-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" required>
                </div>

                <!-- NOVO CAMPO: E-mail (Obrigatório para identificação de ponto) -->
                <div class="input-group">
                    <label for="email">E-mail (Identificação de Ponto)</label>
                    <input type="email" id="email" required>
                </div>
                <!-- FIM NOVO CAMPO -->

                <div class="input-group">
                    <label for="cargo">Cargo na Zee</label>
                    <input type="text" id="cargo" required>
                </div>
                
                <button type="submit" class="btn-submit">
                    <i class="fas fa-user-tag"></i> CADASTRAR FUNCIONÁRIO PONTO
                </button>
            </form>
            
            <div id="msg-feedback"></div>
            <a href="menu.html" class="btn-back"><i class="fas fa-arrow-left"></i> Voltar ao Menu</a>
        </main>
    </div>
    <script>
        const API_BASE_URL = window.location.origin;

        function checkAdminPermission() {
            const userPermissao = localStorage.getItem('usuarioLogadoPermissao');
            // Permite que apenas Admins acessem esta tela
            if (userPermissao !== 'admin') {
                // Se não for admin, redireciona para o menu.
                window.location.href = 'menu.html'; 
            }
        }
        window.onload = checkAdminPermission;


        document.getElementById('form-cadastro-ponto').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msg = document.getElementById('msg-feedback');
            const submitBtn = document.querySelector('.btn-submit');
            
            msg.className = 'loading';
            msg.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Aguarde, cadastrando funcionário...';
            msg.style.display = 'block';
            submitBtn.disabled = true;

            const dados = {
                nome: document.getElementById('nome').value,
                // INCLUINDO O E-MAIL nos dados de envio
                email: document.getElementById('email').value, 
                cargo: document.getElementById('cargo').value
                // senha e isUser=false são omitidos, o backend assume 'ponto'
            };

            try {
                const response = await fetch(`${API_BASE_URL}/api/cadastro`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                const data = await response.json();

                if (response.ok) {
                    msg.className = 'success';
                    msg.innerHTML = `<i class="fas fa-check-circle"></i> ${data.message}`;
                    e.target.reset(); 
                } else {
                    msg.className = 'error';
                    // Tratamento específico se o e-mail já estiver em uso (isUser=true ou outro ponto)
                    msg.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Erro: ${data.message || 'Falha ao cadastrar funcionário.'}`;
                }

            } catch (error) {
                msg.className = 'error';
                msg.innerHTML = '<i class="fas fa-times-circle"></i> Erro de rede. Verifique a conexão com a API.';
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
