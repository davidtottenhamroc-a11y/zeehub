<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Ponto Administrativo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Estilos base (vermelho/branco) */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #F0F0F0; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); overflow: hidden; margin-bottom: 30px; }
        
        header { background: #E62B4E; color: white; padding: 20px; text-align: center; }
        .header-content { display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        .logo-header { height: 40px; width: auto; margin-right: 15px; }
        h1 { font-size: 24px; margin-bottom: 5px; }
        .description { font-size: 14px; opacity: 0.9; }
        main { padding: 30px 20px; }

        /* Estilos do Formulário */
        form { background: #fdfdfd; padding: 30px; border-radius: 10px; border: 1px solid #eee; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        .input-group select, .input-group textarea { 
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; 
            transition: border-color 0.3s; font-size: 16px;
        }
        .input-group select:focus, .input-group textarea:focus { border-color: #E62B4E; outline: none; box-shadow: 0 0 5px rgba(230, 43, 78, 0.5); }
        
        .btn-submit { 
            width: 100%; padding: 15px; background: #E62B4E; color: white; border: none; 
            border-radius: 8px; font-size: 18px; cursor: pointer; transition: background 0.3s; 
        }
        .btn-submit:hover { background: #CC2545; }

        /* Mensagens de feedback e status */
        #msg-feedback { 
            margin-top: 20px; padding: 15px; border-radius: 5px; font-weight: bold; 
            text-align: center; display: none;
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; } 
        .loading { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; } 
        
        .btn-back { display: block; margin-top: 20px; text-align: center; text-decoration: none; color: #E62B4E; font-weight: bold; }
        .btn-back:hover { text-decoration: underline; }

        .hidden { display: none !important; }

        #access-denied { color: #E62B4E; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <i class="fas fa-user-shield" style="font-size: 30px; margin-right: 15px;"></i>
                <h1>Registro de Ponto (Admin)</h1>
            </div>
            <p class="description">Para uso exclusivo de administradores e gerentes para registrar o ponto de outros funcionários.</p>
        </header>

        <main id="main-content">
            <div id="loading-status" style="text-align: center; padding: 50px;">
                <i class="fas fa-spinner fa-spin fa-2x" style="color: #E62B4E;"></i> 
                <p style="margin-top: 15px;">Carregando dados e verificando permissão...</p>
            </div>

            <div id="access-denied" class="hidden" style="text-align: center; padding: 50px;">
                <h2><i class="fas fa-lock"></i> Acesso Negado</h2>
                <p style="margin-top: 10px;">Você não tem permissão de administrador para acessar esta funcionalidade.</p>
                <a href="menu.html" class="btn-back"><i class="fas fa-arrow-left"></i> Voltar ao Menu</a>
            </div>

            <form id="form-registro-ponto" class="hidden">
                <div class="input-group">
                    <label for="funcionario-select">Funcionário</label>
                    <select id="funcionario-select" required>
                        <option value="" disabled selected>Selecione o funcionário</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="tipo-ponto">Tipo de Ponto a Registrar</label>
                    <select id="tipo-ponto" required>
                        <option value="" disabled selected>Escolha o tipo...</option>
                        <option value="checkin">Entrada (Check-in)</option>
                        <option value="pausa">Pausa (Almoço/Intervalo)</option>
                        <option value="retorno">Retorno (Fim da Pausa)</option>
                        <option value="checkout">Saída (Check-out)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="observacao">Observação (Opcional)</label>
                    <textarea id="observacao" rows="3" placeholder="Ex: Esqueceu o crachá, registro manual."></textarea>
                </div>
                
                <button type="submit" class="btn-submit">
                    <i class="fas fa-clock"></i> REGISTRAR PONTO AGORA
                </button>
            </form>
            
            <div id="msg-feedback"></div>
            <a href="menu.html" class="btn-back" id="back-to-menu-link"><i class="fas fa-arrow-left"></i> Voltar ao Menu</a>
        </main>
    </div>
    <script>
        const API_BASE_URL = window.location.origin;
        const form = document.getElementById('form-registro-ponto');
        const denied = document.getElementById('access-denied');
        const loading = document.getElementById('loading-status');
        const funcionarioSelect = document.getElementById('funcionario-select');
        const msgFeedback = document.getElementById('msg-feedback');

        // Função principal para carregar a página
        async function initPage() {
            loading.classList.remove('hidden');
            form.classList.add('hidden');
            denied.classList.add('hidden');

            const userPermissao = localStorage.getItem('usuarioLogadoPermissao');

            // 1. Verificar permissão de Admin (ou o email específico 'chiaraliraa@gmail.com')
            // O sistema de permissão 'admin' é o mais seguro.
            if (userPermissao !== 'admin') {
                loading.classList.add('hidden');
                denied.classList.remove('hidden');
                return;
            }

            // 2. Carregar lista de funcionários
            try {
                const response = await fetch(`${API_BASE_URL}/api/funcionarios-ponto`);
                const funcionarios = await response.json();

                if (response.ok) {
                    funcionarios.forEach(func => {
                        const option = document.createElement('option');
                        option.value = func._id;
                        option.textContent = `${func.nome} (${func.cargo})`;
                        funcionarioSelect.appendChild(option);
                    });
                    
                    loading.classList.add('hidden');
                    form.classList.remove('hidden');

                } else {
                    displayMessage('Erro ao carregar lista de funcionários.', 'error');
                }
            } catch (error) {
                console.error('Erro de rede ao buscar funcionários:', error);
                displayMessage('Erro de rede. Verifique a conexão com a API.', 'error');
            }
        }
        
        // Função para exibir feedback na tela
        function displayMessage(message, type) {
            msgFeedback.className = type;
            msgFeedback.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i> ${message}`;
            msgFeedback.style.display = 'block';
        }

        // Evento de submissão do formulário
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.querySelector('.btn-submit');
            
            displayMessage('Aguarde, registrando ponto...', 'loading');
            submitBtn.disabled = true;

            const dados = {
                funcionario: funcionarioSelect.value,
                tipo: document.getElementById('tipo-ponto').value,
                observacao: document.getElementById('observacao').value
            };

            try {
                const response = await fetch(`${API_BASE_URL}/api/ponto`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                const data = await response.json();

                if (response.ok) {
                    displayMessage(`Ponto registrado com sucesso para o funcionário selecionado!`, 'success');
                    form.reset(); // Limpa o formulário
                    funcionarioSelect.value = ''; // Reseta o campo de seleção
                } else {
                    displayMessage(`Erro: ${data.message || 'Falha ao registrar ponto.'}`, 'error');
                }

            } catch (error) {
                console.error('Erro de rede ao registrar ponto:', error);
                displayMessage('Erro de rede. Verifique a conexão com a API.', 'error');
            } finally {
                submitBtn.disabled = false;
            }
        });

        window.onload = initPage;
    </script>
</body>
</html>
