<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zee Hub - Cadastro de Contrato</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Estilos base (vermelho/branco) */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #F0F0F0; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 700px; width: 100%; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); overflow: hidden; margin-bottom: 30px; }
        
        header { background: #E62B4E; color: white; padding: 20px; text-align: center; }
        .header-content { display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        .logo-header { height: 40px; width: auto; margin-right: 15px; }
        h1 { font-size: 28px; margin-bottom: 5px; }
        .description { font-size: 16px; opacity: 0.9; }
        main { padding: 40px 20px; }

        /* Estilos do Formulário */
        form { background: #fdfdfd; padding: 30px; border-radius: 10px; border: 1px solid #eee; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        .input-group input, .input-group select, .input-group textarea { 
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; 
            transition: border-color 0.3s; font-size: 16px;
        }
        .input-group input[type="file"] {
            border: none;
            padding: 10px 0;
        }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus { border-color: #E62B4E; outline: none; box-shadow: 0 0 5px rgba(230, 43, 78, 0.5); }
        
        .btn-submit { 
            width: 100%; padding: 15px; background: #2ecc71; color: white; border: none; 
            border-radius: 8px; font-size: 18px; cursor: pointer; transition: background 0.3s; 
        }
        .btn-submit:hover { background: #27ae60; }

        /* Mensagens de feedback */
        #msg-feedback { 
            margin-top: 20px; padding: 15px; border-radius: 5px; font-weight: bold; 
            text-align: center; display: none;
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6fb; } 
        .loading { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; } 
        
        .btn-back { display: block; margin-top: 20px; text-align: center; text-decoration: none; color: #E62B4E; font-weight: bold; }
        .btn-back:hover { text-decoration: underline; }
        
        .admin-denied { text-align: center; color: #E62B4E; padding: 50px; }
        .admin-denied h2 { margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <i class="fas fa-file-contract" style="font-size: 30px; margin-right: 15px;"></i>
                <h1>Cadastro de Contrato Fechado</h1>
            </div>
            <p class="description">Registre vendas e aluguéis finalizados pela imobiliária.</p>
        </header>

        <main id="main-content">
            <div id="loading-status" style="text-align: center; padding: 50px;">
                <i class="fas fa-spinner fa-spin fa-2x" style="color: #E62B4E;"></i> 
                <p style="margin-top: 15px;">Carregando dados e verificando permissão...</p>
            </div>

            <div id="access-denied" class="admin-denied" style="display: none;">
                <h2><i class="fas fa-lock"></i> Acesso Negado</h2>
                <p>Esta funcionalidade é restrita apenas a usuários com permissão **Admin**.</p>
                <a href="menu.html" class="btn-back"><i class="fas fa-arrow-left"></i> Voltar ao Menu</a>
            </div>

            <form id="form-cadastro-contrato" style="display: none;">
                <div class="input-group">
                    <label for="tipo">Tipo de Contrato</label>
                    <select id="tipo" required>
                        <option value="" disabled selected>Selecione...</option>
                        <option value="Venda">Venda</option>
                        <option value="Aluguel">Aluguel</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label for="imovelEndereco">Endereço do Imóvel</label>
                    <input type="text" id="imovelEndereco" required placeholder="Rua, Número, Bairro, Cidade">
                </div>

                <div class="input-group">
                    <label for="valorContrato">Valor Total do Contrato (R$)</label>
                    <input type="number" id="valorContrato" required min="0" step="0.01" placeholder="Ex: 500000.00">
                </div>
                
                <div class="input-group">
                    <label for="corretor-select">Corretor Responsável</label>
                    <select id="corretor-select" required>
                        <option value="" disabled selected>Carregando corretores...</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="dataFechamento">Data de Fechamento</label>
                    <input type="date" id="dataFechamento" required>
                </div>
                
                <!-- NOVO CAMPO DE ARQUIVO -->
                <div class="input-group">
                    <label for="arquivoContrato">Anexar Contrato (PDF/Imagem - Máx 1MB)</label>
                    <input type="file" id="arquivoContrato" accept=".pdf, image/*">
                </div>
                <!-- FIM NOVO CAMPO -->

                <div class="input-group">
                    <label for="observacoes">Observações</label>
                    <textarea id="observacoes" rows="3"></textarea>
                </div>
                
                <button type="submit" class="btn-submit">
                    <i class="fas fa-save"></i> REGISTRAR CONTRATO
                </button>
            </form>
            
            <div id="msg-feedback"></div>
            <a href="menu.html" class="btn-back" id="back-to-menu-link">Voltar ao Menu</a>
        </main>
    </div>
    <script>
        const API_BASE_URL = window.location.origin;
        const MAX_FILE_SIZE = 1048576; // 1 MB em bytes

        // Função para converter arquivo para Base64
        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // Função para carregar corretores (funcionários com login)
        async function loadCorretores() {
            try {
                // Buscamos todos os funcionários (que incluem os corretores)
                const response = await fetch(`${API_BASE_URL}/api/funcionarios-ponto`);
                const funcionarios = await response.json();
                
                const select = document.getElementById('corretor-select');
                select.innerHTML = '<option value="" disabled selected>Selecione o corretor...</option>';

                // Filtra apenas usuários com login (admin, gestor, funcionario)
                funcionarios.filter(f => f.isUser).forEach(func => { 
                    const option = document.createElement('option');
                    option.value = func._id;
                    option.textContent = `${func.nome} (${func.cargo})`;
                    select.appendChild(option);
                });

            } catch (error) {
                console.error('Erro ao carregar corretores:', error);
                document.getElementById('msg-feedback').innerHTML = '<div class="error">Falha ao carregar lista de corretores. Verifique a API.</div>';
            }
        }

        // Função para checar permissão e inicializar
        async function initPage() {
            const userPermissao = localStorage.getItem('usuarioLogadoPermissao');
            const loading = document.getElementById('loading-status');
            const form = document.getElementById('form-cadastro-contrato');
            const denied = document.getElementById('access-denied');

            if (userPermissao !== 'admin') {
                loading.style.display = 'none';
                denied.style.display = 'block';
                return;
            }

            // Permissão concedida
            await loadCorretores();
            loading.style.display = 'none';
            form.style.display = 'block';
            
            // Define a data de fechamento padrão para hoje
            document.getElementById('dataFechamento').valueAsDate = new Date();
        }

        // Função para submeter o contrato
        document.getElementById('form-cadastro-contrato').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msg = document.getElementById('msg-feedback');
            const submitBtn = document.querySelector('.btn-submit');
            
            msg.className = 'loading';
            msg.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Registrando contrato...';
            msg.style.display = 'block';
            submitBtn.disabled = true;

            const arquivoInput = document.getElementById('arquivoContrato');
            const file = arquivoInput.files[0];
            let arquivoBase64 = null;
            let fileName = null;

            try {
                // 1. Processar Arquivo (Base64)
                if (file) {
                    if (file.size > MAX_FILE_SIZE) {
                        throw new Error("Arquivo muito grande. O tamanho máximo é 1MB.");
                    }
                    arquivoBase64 = await getBase64(file);
                    fileName = file.name;
                }

                // 2. Montar Dados
                const dados = {
                    tipo: document.getElementById('tipo').value,
                    imovelEndereco: document.getElementById('imovelEndereco').value,
                    valorContrato: parseFloat(document.getElementById('valorContrato').value),
                    corretor: document.getElementById('corretor-select').value,
                    dataFechamento: document.getElementById('dataFechamento').value,
                    observacoes: document.getElementById('observacoes').value,
                    // Dados do arquivo
                    arquivo: arquivoBase64,
                    nomeArquivo: fileName
                };
                
                // 3. Enviar para a API
                const response = await fetch(`${API_BASE_URL}/api/contratos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                const data = await response.json();

                if (response.ok) {
                    msg.className = 'success';
                    msg.innerHTML = `<i class="fas fa-check-circle"></i> Contrato cadastrado com sucesso! ID: ${data.contrato._id}`;
                    e.target.reset(); 
                    document.getElementById('dataFechamento').valueAsDate = new Date();
                } else {
                    msg.className = 'error';
                    msg.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Erro: ${data.message || 'Falha ao registrar contrato.'}`;
                }

            } catch (error) {
                // Captura erros de arquivo (Base64 ou tamanho) e erros de rede
                const errorMessage = error.message.includes("Falha") ? error.message : `Erro: ${error.message}`;
                msg.className = 'error';
                msg.innerHTML = `<i class="fas fa-times-circle"></i> ${errorMessage}`;
            } finally {
                submitBtn.disabled = false;
            }
        });

        window.onload = initPage;
    </script>
</body>
</html>
